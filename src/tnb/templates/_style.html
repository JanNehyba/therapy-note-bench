<style>
  /* ---------------------------------------------------------------------
     A report, not a dashboard.

     This sheet was a stack of rounded cards on a grey ground, and the prose
     inside them was set at nine sizes and three column widths. Measured at a
     1440px viewport: a paragraph in the footer ran from x=20 to x=948, the
     identical paragraph inside a card ran from x=39 to x=967, and the heading
     above that paragraph ran to x=1370. Three left edges and three right edges
     on one page, none of them agreeing, which is what a reader means when they
     say a page looks generated.

     So the rules below are one column, one scale of sizes, one scale of
     spaces, and hairlines instead of boxes. Only two things are allowed to be
     wider than the column: the table, which is what the page is for, and a
     figure. Everything else lines up with everything else.
     --------------------------------------------------------------------- */
  :root {
    color-scheme: light dark;

    /* Paper and ink. Warm rather than blue-grey: this page is read for
       minutes at a time and is almost entirely text. */
    --bg: #fdfcf8;
    /* Kept, and equal to the page: the saturation plot strokes a halo around
       an overlapping dot in the colour behind it. */
    --card: #fdfcf8;
    --raise: #f3f0e7;
    --fg: #1b1a17;
    /* Body text that is not the loudest thing on the page but is still text.
       Whole paragraphs used to be set in `--muted`, which is a label colour --
       at 13px on paper that is a caption, not an argument. */
    --ink: #3b3931;
    --muted: #6c695f;
    --line: #e4e0d5;
    --line-strong: #b9b4a4;
    --accent: #1e5c44;
    --accent-tint: #eef3f0;
    --warn: #8a5a00;
    --chip: #efece2;
    --up: #2f7d4f;
    --down: #b4472f;

    /* Verdict colours. Chosen with the palette validator rather than by eye.
       The three that signal -- discriminating, saturated, unreachable -- clear
       the lightness band, the chroma floor, the CVD separation threshold and
       3:1 contrast, on both surfaces. Re-checked 2026-08-26.

       `--v-mixed` is grey on purpose and fails the chroma floor on purpose:
       its verdict is "partly, weakly", and a fourth hue would make the neutral
       case look like a fourth finding. Run the validator on the three, not on
       the four. Every mark also carries a word, so colour is never the only
       channel either way. */
    --v-discriminating: #00806a; --v-saturated: #c05a10; --v-unreachable: #4a4fb8;
    --v-mixed: #7d8a85;

    /* Two faces, and the split is the one a journal uses: the argument is set
       in a serif, the apparatus -- column headings, switches, chips, every
       figure in a table -- in a sans. A page set end to end in the system UI
       font is the look this was asked to stop having. */
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua",
             Georgia, Cambria, serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Roboto,
            Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, "Cascadia Mono", Consolas,
            "Liberation Mono", monospace;

    /* One scale. There were nine sizes here, four of them inside 0.6px of each
       other -- 13.76, 13.6, 13.44, 13.12 -- which no reader can see as a
       hierarchy and every reader can see as noise. */
    --t-xs: .6875rem;    /* 11px -- column headings, chips */
    --t-sm: .8125rem;    /* 13px -- captions, metadata */
    --t-md: .9375rem;    /* 15px -- tables, apparatus */
    --t-body: 1.0625rem; /* 17px -- prose */
    --t-lg: 1.25rem;     /* 20px -- section heading */
    --t-xl: 2rem;        /* 32px -- the title */

    /* One scale for space, so a gap is a decision and not a leftover. The
       margins on this page were 1.6, 3.2, 6.4, 9.6, 12.8, 14.4, 16, 17.6,
       22.4, 24, 32 and 40 pixels. */
    --s1: .25rem; --s2: .5rem;  --s3: .75rem; --s4: 1rem;
    --s5: 1.5rem; --s6: 2rem;   --s7: 3rem;   --s8: 4.5rem;

    /* The column IS the page. It was a 42rem column left-aligned inside a
       76rem frame, which put every paragraph in the left half of the window
       and left the right half empty -- the first thing anyone said about it
       was that the text stops halfway across. Centring the page on the column
       and letting only the table reach past it says the same thing without
       the hole. */
    --measure: 44rem;
    --wide: 96rem;
    --gutter: 1.5rem;

    --radius: 3px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15161a; --card: #15161a; --raise: #1e2025;
      --fg: #ece9e2; --ink: #c6c2b8; --muted: #918d84;
      --line: #2b2d32; --line-strong: #474a51;
      --accent: #7fc0a0; --accent-tint: #1c2622; --warn: #d5a03c; --chip: #23252a;
      --up: #6fce97; --down: #f0866a;
      --v-discriminating: #22a184; --v-saturated: #c9701f; --v-unreachable: #7c80e0;
      --v-mixed: #7d8a85;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: var(--s7) var(--gutter) var(--s8);
    background: var(--bg);
    color: var(--fg);
    font-family: var(--serif);
    font-size: var(--t-body);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  /* The page. Centred, and as wide as one column of prose: everything in it
     fills it, so there is one left edge and one right edge and no block that
     stops short of the others. */
  main { max-width: var(--measure); margin: 0 auto; }

  /* Every block fills the page and stops where the page stops. This was a
     list of selectors each capped at its own measure inside a wider frame,
     which is how the same sentence came to end in three different places. */
  p, ul, ol, dl, footer, h2, h3, h4, summary, figcaption, .legend, .design,
  .pair, .soap, .criteria, .switch, .controls, .track-head {
    max-width: 100%;
  }

  a { color: var(--accent); text-underline-offset: .15em; }
  a:hover { text-decoration-thickness: 2px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  code { font-family: var(--mono); font-size: .88em; }

  /* --- the masthead ----------------------------------------------------- */

  h1 {
    font-size: var(--t-xl); line-height: 1.15; letter-spacing: -.015em;
    font-weight: 600; margin: 0 0 var(--s3);
  }
  p.sub { color: var(--ink); margin: 0 0 var(--s6); max-width: 100%; }

  /* The language switch. Deliberately quiet: it sits in the corner above the
     title, reads as two three-letter words, and never competes with the thing
     the reader came for. English is the default and is not a preference the
     page guesses -- see `chosenLanguage` in the helpers. */
  .lang { float: right; display: flex; gap: var(--s1); margin: var(--s1) 0 0; }
  .lang:empty { display: none; }
  .lang button {
    font-family: var(--sans); font-size: var(--t-xs); letter-spacing: .08em;
    cursor: pointer; padding: .2rem .45rem; border: 1px solid transparent;
    border-radius: var(--radius); background: none; color: var(--muted);
  }
  .lang button:hover { color: var(--fg); }
  .lang button[aria-pressed="true"] {
    color: var(--accent); border-color: var(--line-strong);
  }

  /* --- sections --------------------------------------------------------- */

  /* Was a filled, rounded, bordered card. A card puts everything inside it
     19px to the right of everything outside it, which is half of why nothing
     on this page lined up; and eleven cards down a page is a layout with no
     hierarchy in it at all. A rule and a large space say the same thing and
     cost no alignment. */
  .box {
    margin: var(--s7) 0 0;
    padding: var(--s6) 0 0;
    border-top: 1px solid var(--line);
  }
  /* A panel with nothing measured in it yet. Dashed, so it reads as "not
     filled in" rather than as a section somebody abandoned. */
  .box.pending { border-top-style: dashed; }

  h2 {
    font-size: var(--t-lg); line-height: 1.3; font-weight: 600;
    margin: 0 0 var(--s3); letter-spacing: -.005em;
  }
  h2 .badge { font-weight: 400; }

  details.box > summary {
    cursor: pointer; font-size: var(--t-lg); line-height: 1.3;
    margin: 0 0 var(--s3);
  }
  details.box > summary strong { font-weight: 600; }
  details.box[open] > summary { margin-bottom: var(--s4); }

  /* The lede under a section heading. Measured in `rem`, never in `ch`: a `ch`
     measure shrinks with the font size, and at .9rem the old 68ch came out
     around half the frame beside a table running all of it, which read as a
     broken column rather than as a comfortable line. */
  p.blurb {
    color: var(--ink);
    margin: 0 0 var(--s4);
    max-width: 100%;
  }

  /* --- prose ------------------------------------------------------------ */

  p { margin: 0 0 var(--s4); }

  /* Commentary on the table above it. This used to set the whole paragraph in
     `--warn`, and the methods page carries thirty-seven of them: ten
     consecutive paragraphs of orange body text, which is hard to read and,
     worse, means the colour has stopped marking anything. The sentence is now
     ink like every other sentence and a quiet rule in the margin sets it off;
     consecutive notes share one unbroken rule rather than drawing a ladder of
     stripes. The rule is grey and not amber because `note` is what nearly
     every explanatory paragraph on the methods page is: a mark carried by
     almost every block marks nothing. Amber is left to the two places that
     really do name a caveat -- the bold clause a note opens with, and the
     `<em>` a column's definition ends with. */
  p.note {
    color: var(--ink);
    border-left: 2px solid var(--line-strong);
    padding: 0 0 0 var(--s4);
    margin: var(--s5) 0;
  }
  p.note + p.note { margin-top: 0; padding-top: var(--s4); }
  p.note strong { color: var(--warn); }

  p.ranking-note { color: var(--ink); margin: var(--s5) 0 var(--s4); }

  p.versions {
    font-family: var(--sans); color: var(--muted); font-size: var(--t-sm);
    margin: var(--s5) 0 0;
  }
  .versions code {
    background: var(--chip); padding: .1em .35em; border-radius: var(--radius);
  }
  .subtitle { font-weight: 400; color: var(--muted); }

  /* --- the wide two ----------------------------------------------------- */

  /* The table and a figure are the only two blocks allowed past the page's
     own width, and they reach out symmetrically on both sides of it rather
     than growing to the right.

     `100%` in a margin resolves against the parent, which is the page, so
     `(wanted - 100%) / -2` is exactly the overhang, split in two. The extra
     1.25rem subtracted from the viewport is the scrollbar: `100vw` counts it
     and `clientWidth` does not, and without the allowance a wide table hands
     the whole document a horizontal scrollbar of its own. Checked by
     measurement at 390, 1440 and 1900: `scrollWidth === clientWidth`. */
  .scroll, .scroll-top, figure.wide {
    /* As wide as it needs and no wider. Sized to the content rather than to
       the cap, because `width: <the cap>` stretched every small table to it
       too -- the calibration table on the methods page has five columns, and
       spreading five columns over 1216px is not a wide table, it is a sparse
       one. */
    width: max-content;
    /* Never narrower than the page. A table sized purely to its content came
       out at a different width on every panel of the methods page -- fourteen
       tables, fourteen sets of edges, none of them lining up with the prose
       above them or with each other. At `min-width: 100%` a small table is
       exactly the column and sits inside the same two edges as every
       paragraph; only a table that genuinely outgrows the column reaches
       past it. */
    min-width: 100%;
    max-width: min(var(--wide), calc(100vw - 2 * var(--gutter) - 1.25rem));
    /* Centred on the page without anyone having to know how wide it came out.
       `margin-inline: auto` cannot do this -- an element wider than its parent
       does not centre, it overflows to the right -- and a negative margin
       would have to name the width, which is the thing we just stopped
       naming. The 1.25rem above is the scrollbar: `100vw` counts it and
       `clientWidth` does not, and without the allowance a wide table hands the
       whole document a horizontal scrollbar of its own. */
    position: relative;
    left: 50%;
    transform: translateX(-50%);
  }

  .scroll { overflow-x: auto; }
  /* A sideways scrollbar sits under the table, which on a long table is a
     screen away from the columns it scrolls. This is the same bar above it:
     an empty strip as wide as the table, scrolled in step with it. It is
     removed rather than shown empty when the table fits. */
  .scroll-top { overflow-x: auto; overflow-y: hidden; }
  .scroll-top > div { height: 1px; }
  .scroll-top[hidden] { display: none; }

  /* A generated figure. It scrolls rather than shrinking: the labels are 12px
     and a 940px drawing squeezed into a phone renders them at about five. */
  figure.wide { margin: var(--s5) 0 var(--s6); }
  figure.wide svg { display: block; max-width: 100%; height: auto; }
  figure.wide figcaption {
    font-size: var(--t-sm); color: var(--muted); margin: var(--s2) auto 0;
    max-width: var(--measure);
  }

  /* --- tables ----------------------------------------------------------- */

  table {
    border-collapse: collapse;
    font-family: var(--sans); font-size: var(--t-md);
    font-variant-numeric: tabular-nums;
    /* `width: 100%` across seventeen columns makes the browser squeeze
       whatever will wrap, and what wraps is the model's name: rows came out
       one, two and three lines tall down the same table, which reads as a
       broken table rather than as a wide one. It is as wide as its contents,
       and fills its container when the container is the wider of the two. */
    width: max-content; min-width: 100%;
  }
  th, td {
    text-align: right; padding: .5rem .7rem;
    border-bottom: 1px solid var(--line);
  }
  th:first-child, td:first-child { text-align: left; }
  thead th {
    font-size: var(--t-xs); text-transform: uppercase; letter-spacing: .07em;
    color: var(--muted); font-weight: 600; vertical-align: bottom;
    padding-bottom: .45rem;
    border-bottom: 1px solid var(--line-strong);
  }
  tbody tr:last-child td { border-bottom: 1px solid var(--line-strong); }
  th[data-sort] { cursor: pointer; user-select: none; white-space: nowrap; }
  th[data-sort]:hover { color: var(--fg); }
  /* Which column is doing the sorting, on the column itself. The header was
     already clickable and said so only by turning the cursor into a hand. */
  th[data-sort]::after { content: '\2195'; opacity: .3; margin-left: .35em; font-size: .9em; }
  th[data-sort]:hover::after { opacity: .7; }
  th[aria-sort="descending"]::after { content: '\25BC'; opacity: 1; color: var(--accent); }
  th[aria-sort="ascending"]::after { content: '\25B2'; opacity: 1; color: var(--accent); }
  th[aria-sort] { color: var(--accent); }

  tbody tr.system { cursor: pointer; }
  tbody tr.system:hover td { background: var(--raise); }
  td.name { font-weight: 600; color: var(--fg); white-space: nowrap; }
  td.name .arrow { color: var(--muted); font-weight: 400; display: inline-block; width: 1em; }
  /* The band the row was measured into, not its position. Systems the evidence
     cannot separate share one, so the column repeats a number rather than
     counting up -- which is the point, and looks wrong until you know it. */
  td.rank { color: var(--muted); width: 2.5rem; }
  td.rank.top { color: var(--fg); font-weight: 700; }
  /* The top band, marked with a tint rather than the grey slab that used to
     sit here: four rows of filled cells read as a selected range. */
  tbody tr.first-group td { background: var(--accent-tint); }
  tr.humans td { border-top: 2px solid var(--line-strong); }
  /* A judge that clears the human ceiling on a measure. Marked rather than
     stated per row: the comparison is per column and the eye reads it that
     way. Weight only, no colour: a green cell reads as "good", and clearing
     an agreement ceiling is not a verdict about a model. */
  td.beats { font-weight: 700; }
  /* The provider, and the marks. Apparatus, not findings. */
  td.meta { color: var(--muted); font-size: var(--t-sm); white-space: nowrap; }

  /* The instrument a column belongs to, above its name. Quieter than the
     label and louder than nothing: a reader scanning eleven headings has to
     see the seam between the two without reading a footnote. */
  th .instrument {
    display: block; font-size: var(--t-xs); letter-spacing: .07em;
    text-transform: uppercase; color: var(--accent); font-weight: 600;
    opacity: .85; margin-bottom: .15rem;
  }

  /* Eleven columns from two instruments do not fit a screen, so the table
     scrolls sideways -- and a row of eleven numbers with the model's name
     scrolled off the left is unreadable. The name column stays put.

     Named by class, not by position. This said `:first-child` and was written
     when the name was the first column; the Band column then went in to the
     left of it, and what a phone kept pinned became a 2.5rem strip of bare
     band digits while the model's name scrolled away -- the exact failure the
     rule exists to prevent. */
  table[data-table] th.rank,
  table[data-table] td.rank {
    position: static;
    box-shadow: none;
  }
  table[data-table] th.name,
  table[data-table] td.name {
    position: sticky;
    left: 0;
    background: var(--bg);
    text-align: left;
    z-index: 1;
  }
  table[data-table] thead th.name { z-index: 2; }
  tbody tr.system:hover td.name { background: var(--raise); }
  tbody tr.first-group td.name { background: var(--accent-tint); }
  /* The scrolled-under edge, so a reader can see that the name is pinned and
     the numbers are moving behind it rather than that the table is broken. */
  table[data-table] th.name::after,
  table[data-table] td.name::after {
    content: '';
    position: absolute;
    top: 0; right: 0; bottom: 0;
    width: 1px;
    background: var(--line);
  }
  @media (max-width: 34rem) {
    table[data-table] th.name, table[data-table] td.name {
      max-width: 9.5rem; white-space: normal;
    }
    td.name { font-size: var(--t-sm); }
  }

  /* The judge-comparison table is read left to right as prose, not scanned as a
     column of figures, so its last column stays left-aligned. */
  table.concordance td:last-child, table.concordance th:last-child { text-align: left; }
  /* Every figure in the calibration and concordance tables. */
  td.num, th.num { text-align: right; }

  /* --- the row a reader opened ------------------------------------------ */

  tr.detail > td {
    background: var(--raise); padding: var(--s4) var(--s4) var(--s5);
    font-family: var(--serif);
  }
  tr.detail h3 {
    font-family: var(--sans); font-size: var(--t-xs); text-transform: uppercase;
    letter-spacing: .07em; color: var(--muted); margin: 0 0 var(--s2);
    font-weight: 600;
  }
  tr.detail table { margin-bottom: var(--s4); background: var(--bg); width: 100%; }
  /* The section breakdown inside an opened row is wrapped in a `.scroll` of
     its own, and it must not take the breakout above: centring it on half of
     its own cell would hang it off the side of the table it lives in. It is
     four rows deep and fits its cell. */
  tr.detail .scroll {
    position: static; left: auto; transform: none;
    width: 100%; max-width: 100%;
  }
  tr.detail p.note { margin: var(--s3) 0; font-size: var(--t-md); }
  .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 0 var(--s5); max-width: none;
  }
  .grid div {
    display: flex; justify-content: space-between; gap: var(--s2);
    border-bottom: 1px solid var(--line); padding: .25rem 0;
    font-family: var(--sans); font-size: var(--t-sm);
  }
  .grid span:last-child { font-variant-numeric: tabular-nums; }

  /* --- marks in a cell -------------------------------------------------- */

  /* Was a grey pill. A pill is a button's shape and none of these do anything;
     squared and hairlined, they read as what they are -- a label stuck to a
     name. */
  .chip {
    display: inline-block; margin-left: var(--s2); padding: .05rem .35rem;
    border: 1px solid var(--line-strong); border-radius: var(--radius);
    background: none; color: var(--muted);
    font-family: var(--sans); font-size: var(--t-xs); font-weight: 500;
    letter-spacing: .03em; text-transform: uppercase; white-space: nowrap;
    vertical-align: 1px;
  }
  /* The reasoning effort a note was written at. It had no rule at all, so it
     printed at full weight straight after the model id and read as part of
     the model's name. */
  .effort {
    margin-left: .4em; color: var(--muted); font-weight: 400;
    font-size: var(--t-sm);
  }
  .short { color: var(--warn); }
  .pending-mark { color: var(--muted); font-size: var(--t-sm); }
  .dash { color: var(--muted); }
  .scale {
    display: inline-block; margin-left: .4em; font-size: var(--t-xs);
    font-weight: 500; letter-spacing: .03em; color: var(--muted);
    font-variant-numeric: tabular-nums; text-transform: none;
  }
  .ranks {
    display: inline-block; margin-left: .4em; padding: .05em .35em;
    border-radius: var(--radius); font-size: var(--t-xs); font-weight: 600;
    text-transform: uppercase; letter-spacing: .05em;
    background: var(--accent-tint); color: var(--accent);
  }
  .differs {
    display: inline-block; margin-left: .45em; padding: .05em .35em;
    border-radius: var(--radius); font-family: var(--sans);
    font-size: var(--t-xs); font-weight: 600; letter-spacing: .03em;
    background: var(--chip); color: var(--warn); white-space: nowrap;
  }

  /* The second judge's figure, written as a distance from the first. Quiet
     and small: it is context for the number beside it, not a number in its own
     right, and a reader scanning a column must still see the column. */
  .gap { margin-left: .4em; font-size: .82em; white-space: nowrap; }
  .gap.up { color: var(--up); }
  .gap.down { color: var(--down); }
  .gap.same, .gap.dash { color: var(--muted); }

  /* --- picking a table -------------------------------------------------- */

  .switch {
    display: flex; flex-wrap: wrap; gap: var(--s3) var(--s6);
    margin: var(--s5) 0 var(--s6); max-width: none;
  }
  /* Both are written on every render and are legitimately empty when there is
     one table and nothing to filter. Their margins are not: an empty container
     leaves a gap that reads as a missing control. */
  .switch:empty, .controls:empty { display: none; margin: 0; }
  .pick { display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--s1); }
  .pick-label {
    font-family: var(--sans); font-size: var(--t-xs); letter-spacing: .08em;
    text-transform: uppercase; color: var(--muted); margin-right: var(--s2);
  }
  /* Was a row of rounded outlined pills, which is the shape a generated page
     uses for everything. These are tabs: a word, and a rule under the one that
     is showing. */
  .pick button {
    font-family: var(--sans); font-size: var(--t-md); line-height: 1.3;
    cursor: pointer; display: inline-flex; flex-direction: column;
    align-items: flex-start; padding: .3rem .1rem; margin-right: var(--s4);
    border: 0; border-bottom: 2px solid transparent; border-radius: 0;
    background: none; color: var(--muted);
  }
  .pick button:hover { color: var(--fg); border-bottom-color: var(--line-strong); }
  /* The pressed state is read off `aria-pressed`, so the announcement and the
     appearance are the same fact rather than two that can disagree. */
  .pick button[aria-pressed="true"] {
    color: var(--fg); border-bottom-color: var(--accent); font-weight: 600;
  }
  .pick button .scale { margin: .1rem 0 0; font-weight: 400; }

  .controls {
    display: flex; flex-wrap: wrap; gap: var(--s2) var(--s5);
    margin: 0 0 var(--s5); max-width: none;
  }
  .controls label {
    display: inline-flex; align-items: center; gap: var(--s2);
    font-family: var(--sans); font-size: var(--t-md); color: var(--ink);
  }

  /* --- the legend under a table ----------------------------------------- */

  /* Was a bordered panel of two-column rows, 928px wide, ending 19px to the
