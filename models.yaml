# Which models get benchmarked, and where they run.
#
# This file deliberately contains NO hard-coded model list. The authoritative
# source is each provider's live endpoint:
#
#     GET <base_url>/models
#
# No provider guarantees that a model version stays available -- e-INFRA's
# documentation says so outright -- so anything pinned here would rot. The
# harness discovers what is deployed today and filters it with the rules below.
# When e-INFRA swaps glm-5.2 for glm-5.3, the leaderboard follows on the next
# run.
#
# Adding a provider is a stanza here, not a code change. A provider whose token
# is not set is skipped rather than failing the run.
#
# The provider is part of a model's identity in the results, never a footnote:
# the same name on two endpoints can be two different things -- a different
# quantisation, different weights, a different system prompt -- and a table that
# merged them would compare two models under one row. `tnb models --probe`
# detects that case the same way it detects duplicate names within one provider:
# by asking, and comparing the answers.

# Shared defaults. Any provider may override any of these in its own
# `generation:` block; rate limits in particular belong to the endpoint.
generation:
  temperature: 0.0
  # Reasoning models spend their budget thinking before they write. At 64 tokens
  # several of them returned empty content and looked broken, so this has room.
  max_tokens: 4096
  # ...and 4096 is still not always enough. On 2026-08-23,
  # deepseek-v4-flash-thinking spent all 4096 tokens on 20k characters of
  # reasoning for one iCARE section and returned no content at all. A call that
  # stops on `length` without a usable answer is asked once more with this
  # budget. Both numbers are part of the cache key, so which of the two a note
  # was written with never changes whether it is reused.
  escalate_max_tokens: 16384
  concurrency: 2
  backoff_s: 6
  timeout_s: 180
  retries: 3

providers:
  - name: einfra
    base_url: https://llm.ai.e-infra.cz/v1
    base_url_env: EINFRA_BASE_URL
    token_env: EINFRA_API_TOKEN
    token_help: >-
      Get one at https://chat.ai.e-infra.cz -> Account -> API keys (needs a
      MetaCentrum account or Masaryk University affiliation), then put it in
      .env or export it.

    generation:
      # e-INFRA rate-limits per API key, not per model. Six concurrent requests
      # produced HTTP 429 on roughly a third of calls; two is well-behaved on a
      # shared academic service that is also somebody else's quota.
      concurrency: 2

    discovery:
      # Drop ids matching any of these (case-insensitive regex). These are models
      # that exist on the endpoint but cannot generate a therapy note. They also
      # answer /chat/completions with a 404, which `tnb models --probe` reports.
      exclude:
        - "^whisper"          # speech recognition
        - "embed"             # embedding models
        - "e5-"               # multilingual-e5-large-instruct
        - "-rerank"
        - "^all-proxy-models$" # meta-entry; rejects generation with HTTP 400

      # Unversioned names (glm, kimi, coder, thinker, ...) are excluded even when
      # they are not duplicates. Whatever such a name points at today, it will
      # point somewhere else after the next deployment, so a leaderboard row
      # carrying that label would compare two different models across runs.
      exclude_aliases: true

      # Verified duplicates: alias -> the concrete model it actually is.
      #
      # Established on 2026-08-23 by fingerprinting, not by reading names: each
      # id was asked one fixed question at temperature 0 and the answers
      # compared. Byte-identical answer means the same model. Determinism was
      # checked first -- three consecutive calls to six models each returned
      # identical text.
      #
      # Regenerate with `tnb models --probe`.
      #
      # Note `command-a` in particular: the name suggests Cohere Command A, but
      # it returns gemma4's exact output. The name-based heuristic happened to
      # exclude it for the wrong reason; this map records the right one.
      aliases:
        auto-llm: gemma4
        auto-llm-heuristic: gemma4
        command-a: gemma4
        deepseek: deepseek-v4-flash
        thinker: deepseek-v4-flash-thinking
        qwen3.5: qwen3.5-int4
        mini: gpt-oss-120b

      # Safety net: refuse to start a full run against more models than this
      # without an explicit --allow-large flag.
      max_models: 20

  # A second provider looks like this. Uncomment, set the token in .env, and the
  # next run adds its models as their own rows -- same protocols, same judge,
  # same prompt version, with the provider recorded next to each model id.
  #
  # - name: some-other-host
  #   base_url: https://api.example.org/v1
  #   token_env: SOME_OTHER_HOST_TOKEN
  #   token_help: "See https://example.org/docs/api-keys."
  #   discovery:
  #     exclude: ["embed", "-rerank"]
  #     exclude_aliases: true
  #     max_models: 20
