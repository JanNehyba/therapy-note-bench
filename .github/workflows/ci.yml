name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --all-groups

      - name: Lint
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests

      # Offline only. Nothing in CI touches e-INFRA or the judge API, so this
      # job needs no secrets and is safe to run on pull requests from forks.
      - name: Test
        run: uv run pytest -q
