# Manual benchmark run.
#
# There is deliberately NO schedule. Runs cost e-INFRA quota and judge dollars,
# so nothing happens without someone pressing the button. To enable a monthly
# run, uncomment the two `schedule:` lines below.
#
# There is also deliberately no `pull_request` trigger: secrets must never be
# reachable from a fork.

name: Benchmark

on:
  workflow_dispatch:
    inputs:
      providers:
        description: "Comma-separated provider names. Blank = every one with a token."
        required: false
        default: ""
      models:
        description: "Comma-separated model ids. Blank = every discovered model."
        required: false
        default: ""
      tasks:
        description: "Which note-writing task to run. These are `tnb generate --tasks` values."
        required: true
        default: "all"
        type: choice
        options: [all, soap, icare]
      limit:
        description: "Sessions per task (blank = all). Use a small number for a cheap check."
        required: false
        default: ""
  # schedule:
  #   - cron: "0 4 1 * *"   # 04:00 UTC on the 1st of each month

permissions:
  contents: write

concurrency:
  group: benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install
        run: uv sync --all-groups

      - name: Record what each provider has deployed right now
        env:
          EINFRA_API_TOKEN: ${{ secrets.EINFRA_API_TOKEN }}
        run: uv run tnb models --write-snapshot

      # Generation only, and that is the whole truth about this button. It
      # used to call `tnb run`, which is a stub that exits 2, while exporting
      # ANTHROPIC_API_KEY -- which nothing in src/ reads -- and none of
      # VERTEX_PROJECT, VERTEX_LOCATION, GOOGLE_APPLICATION_CREDENTIALS or
      # OPENAI_API_KEY, which is what a judge actually needs. The step could
      # only fail; had it not, it would have failed at scoring.
      #
      # Wiring a judge in is a separate decision with its own cost. The Vertex
      # credential is a service-account JSON that would have to be written to a
      # file from a secret, and a workflow that scores half a corpus before a
      # ceiling stops it publishes a table nobody finished. Until that is
      # decided, the button does the half it can and says so.
      #
      # `--tasks`, not `--tracks`: `soap`/`icare` is what `tnb generate` takes.
      # `tneval-soap` is the leaderboard's word for the same thing and would
      # have been rejected here.
      - name: Generate notes
        env:
          EINFRA_API_TOKEN: ${{ secrets.EINFRA_API_TOKEN }}
        run: |
          uv run tnb generate \
            ${{ inputs.tasks != 'all' && format('--tasks {0}', inputs.tasks) || '' }} \
            ${{ inputs.providers && format('--providers "{0}"', inputs.providers) || '' }} \
            ${{ inputs.models && format('--models "{0}"', inputs.models) || '' }} \
            ${{ inputs.limit && format('--limit {0}', inputs.limit) || '' }}

      # Reads generations/ and results/ and writes the page. No judge, no spend.
      - name: Regenerate leaderboard
        run: uv run tnb report

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results docs/models-snapshot.md README.md
          git diff --staged --quiet && echo "nothing changed" && exit 0
          git commit -m "bench: refresh generation coverage ($(date -u +%Y-%m-%d))"
          git push
