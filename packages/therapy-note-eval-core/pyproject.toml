[project]
name = "therapy-note-eval-core"
version = "0.3.0"
description = "Source-grounded, multilingual evaluation of psychotherapy documentation"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.optional-dependencies]
research = ["scipy>=1.13", "matplotlib>=3.8"]

[project.scripts]
therapy-note-eval = "therapy_note_eval.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/therapy_note_eval"]
