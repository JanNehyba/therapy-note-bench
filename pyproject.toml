[project]
name = "therapy-note-bench"
version = "0.1.0"
description = "Reproducible benchmark of LLM-generated psychotherapy session notes"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Jan Nehyba" }]
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
]

# Kept out of the core install on purpose: bert-score pulls in torch, which is a
# multi-gigabyte download. Discovery, generation and the rubric judge do not
# need it, so only the reference-metric track pays that cost.
[project.optional-dependencies]
generate = ["openai>=1.40"]
judge = ["anthropic>=0.40"]
scoring = [
    "pandas>=2.2",
    "nltk>=3.9",
    "rouge-score>=0.1.2",
    "bert-score>=0.3.13",
    "scipy>=1.13",
]

[project.scripts]
tnb = "tnb.cli:main"

[project.urls]
Homepage = "https://github.com/JanNehyba/therapy-note-bench"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6", "pytest-cov>=5.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tnb"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# TN-Eval's SOAP prompt is reproduced verbatim, long lines and trailing spaces
# included. Rewrapping it would change the string sent to the model and break
# comparability with their published numbers. A test pins its sha256.
"src/tnb/tasks/soap.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
