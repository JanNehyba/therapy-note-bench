<text class="note" x="0" y="702">Grey lines held their place. A pair counts as separable when a paired bootstrap puts the two systems in different groups under that judge — over 33 shared</text>
<text class="note" x="0" y="717">conversations for judge A and 40 for judge B, because more of A's notes went unfinished. Systems that print the same score share a place, and a shared</text>
<text class="note" x="0" y="732">place is drawn as one label. A dagger marks a system the judge on that side shares a vendor with.</text>
<text class="note" x="0" y="744">Source: docs/leaderboard.json and docs/saturation-*.json, harness 0.7.0.</text>
