<text class="title" x="0" y="22">Two judges agree on 122 of the 125 pairs they can separate — and 17 of 21 systems still change place</text><text class="sub" x="0" y="43">Same notes, same rubric, same 23 criteria. Ordered by Completeness. A position is a place in a queue, not a measurement.</text>
